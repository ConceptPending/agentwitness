name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/agentwitness

      # Coverage gate. v0 baseline is 85% branch coverage; ratchet up as
      # code stabilises. The target is 90% on the security-critical
      # modules (canonical, chain, signing, manifest, paths) which are
      # already at or near 100%; the lower modules pull the average down.
      - name: Test
        run: pytest --cov=agentwitness --cov-branch --cov-report=term-missing --cov-fail-under=85
