[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentwitness"
version = "0.0.1"
description = "Verifiable evidence for AI-assisted engineering"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Nick Williamson", email = "nick@nickw.info" },
]
keywords = [
    "ai",
    "agents",
    "provenance",
    "attestation",
    "audit",
    "evidence",
    "claude-code",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://agentwitness.dev"
Repository = "https://github.com/ConceptPending/agentwitness"
Issues = "https://github.com/ConceptPending/agentwitness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwitness"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agentwitness"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
